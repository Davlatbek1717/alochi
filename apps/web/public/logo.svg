<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" fill="none">
  <!--
    A'lochi logo — bold violet "A" sliced through by twin orange swooshes.
    The right leg of the A is "broken" and reappears as a small wedge in
    the lower right, suggesting forward motion / a path.
  -->

  <!-- Main violet "A" body (left side + crown + inner counter cut-out) -->
  <path d="
    M 540 90
    L 80 990
    L 320 990
    L 440 750
    L 660 750
    L 660 660
    L 480 660
    L 540 380
    L 600 540
    L 690 540
    L 540 90 Z
  " fill="#6d28d9"/>

  <!-- Orange swoosh — primary curve sweeping from upper right to lower left -->
  <path d="
    M 990 200
    Q 720 530 320 990
    L 540 990
    Q 870 600 1060 290
    Z
  " fill="#f97316"/>

  <!-- Orange swoosh — secondary curve below the primary, slightly tighter -->
  <path d="
    M 1060 400
    Q 850 700 540 990
    L 720 990
    Q 970 750 1080 510
    Z
  " fill="#f97316"/>

  <!-- Detached violet wedge — the "broken" lower-right leg of the A -->
  <path d="
    M 800 760
    L 920 990
    L 760 990
    Z
  " fill="#6d28d9"/>
</svg>
