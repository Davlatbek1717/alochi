version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alochi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alochi
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: alochi_clickhouse
    environment:
      CLICKHOUSE_USER: alochi
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme_dev_password}
      CLICKHOUSE_DB: alochi_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alochi_api
    env_file: apps/api/.env
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/alochi?schema=public
      PORT: '3001'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: alochi
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme_dev_password}
      CLICKHOUSE_DB: alochi_analytics

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: alochi_web
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001

  ai-service:
    build:
      context: apps/ai-service
      dockerfile: Dockerfile
    container_name: alochi_ai
    ports:
      - '8000:8000'
    env_file: apps/ai-service/.env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: alochi_nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - ai-service

volumes:
  db_data:
  clickhouse_data:
