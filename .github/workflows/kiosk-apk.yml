name: Build A'lojon Kiosk APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'kiosk-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/dist/alojon-kiosk-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alojon-kiosk-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/kiosk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: A'lojon Kiosk ${{ github.ref_name }}
          body: |
            A'lojon kiosk APK. O'rnatish uchun faylni yuklab oling.
